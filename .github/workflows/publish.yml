name: Marketplace release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag (vX.Y.Z), or main for a dry run
        required: true
        default: main
        type: string
      publish:
        description: Publish to Marketplace after verification (requires a release tag)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: marketplace-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      vsix: ${{ steps.source.outputs.vsix }}
    steps:
      - name: Check requested ref
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$RELEASE_REF" != main && ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use main for a dry run or an existing vX.Y.Z release tag.' >&2
            exit 1
          fi
          if [[ "$PUBLISH" == true && ( "$RELEASE_REF" == main || "$PRERELEASE" == true ) ]]; then
            echo 'Marketplace stable publishing requires a stable vX.Y.Z release tag.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || (inputs.ref == 'main' && 'refs/heads/main' || format('refs/tags/{0}', inputs.ref)) }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release identity
        id: source
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          EXPECTED_PUBLISHER: ${{ vars.MARKETPLACE_PUBLISHER || 'MCIN-dlq' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(manifest.version, lock.version);
          assert.equal(manifest.version, lock.packages[''].version);
          assert.equal(manifest.license, 'MIT', 'Use a release containing the MIT license.');
          if (process.env.PUBLISH === 'true') {
            assert.equal(process.env.RELEASE_REF, `v${manifest.version}`, 'Tag and manifest must agree.');
            assert.equal(manifest.publisher, process.env.EXPECTED_PUBLISHER, 'Confirm the production publisher in package.json.');
            assert.ok(!manifest.publisher.endsWith('-dev'), 'Do not publish the development publisher.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `vsix=dist/${manifest.name}-${manifest.version}.vsix\n`);
          JS
          if [[ "$PUBLISH" == true ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run check
      - name: Test minimum supported VS Code
        run: xvfb-run -a npm run test:integration
      - name: Test current stable VS Code
        run: xvfb-run -a npm run test:integration -- --code-version stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: npm run security
      - run: npm audit --audit-level=high
      - run: npm run package
      - name: Record package checksum
        env:
          VSIX: ${{ steps.source.outputs.vsix }}
        run: sha256sum "$VSIX" > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marketplace-package
          path: |
            dist/*.vsix
            SHA256SUMS
          if-no-files-found: error
  codeql:
    needs: verify
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml
    with:
      ref: ${{ needs.verify.outputs.commit }}
  publish:
    if: github.event_name == 'release' || inputs.publish
    needs: [verify, codeql]
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: marketplace-package
      - name: Verify the tested package
        run: sha256sum --check SHA256SUMS
      - name: Publish the tested VSIX with Trusted Publishing
        env:
          VSIX: ${{ needs.verify.outputs.vsix }}
        run: npx --no-install vsce publish --oidc --packagePath "$VSIX"
