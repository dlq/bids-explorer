name: Suggest an improvement
description: Describe a study-exploration task we could make easier.
body:
  - type: textarea
    id: workflow
    attributes:
      label: What are you trying to do?
      description: Describe the neuroimaging workflow and what makes it difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the result you would like. A public or synthetic example can help; omit sensitive study information.
