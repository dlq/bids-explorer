version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Raise this only alongside the minimum supported engines.vscode version.
      - dependency-name: '@types/vscode'
        versions: ['>1.96.0']
      # Keep build-time Node types on the selected Node 22 toolchain.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # Current typescript-eslint supports TypeScript below 6.1; revisit together.
      - dependency-name: typescript
        versions: ['>=6.1.0']
    # Ungrouped major toolchain and production-library updates need separate review.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
